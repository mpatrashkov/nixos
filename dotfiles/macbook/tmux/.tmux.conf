unbind C-b
set -g prefix M-a
bind M-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

bind & kill-window

setw -g mode-keys vi
set -g mouse on

set -g base-index 1

# Show full session names (default status-left-length is 10)
set -g status-left-length 60
set -g status-left '[#S] '

# Pi readiness in the session/window switchers (prefix s / prefix w).
# Aggregate pane markers so collapsed sessions show readiness in any window.
# Native format loops read the existing state without extra scripts or polling.
set -g @pi_tree_ready '#{?pane_format,#{==:#{@pi_ready},1},#{?window_format,#{P:#{?#{==:#{@pi_ready},1},R,}},#{W:#{P:#{?#{==:#{@pi_ready},1},R,}}}}}'
# Keep tmux's default tree details, then append a highlighted readiness badge.
set -g @pi_tree_format '#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},window_format,#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}#{?#{E:@pi_tree_ready}, #[fg=yellow#,bold]PI READY#[default],}'
bind s choose-tree -Zs -F '#{E:@pi_tree_format}'
bind w choose-tree -Zw -F '#{E:@pi_tree_format}'

# --- Jira-linked sessions (session name prefixed with ticket key) ---
bind j display-popup -E -w 80% -h 70% "~/.config/tmux/jira-session.sh new"
bind o run-shell -b "~/.config/tmux/jira-session.sh open '#S'"

# --- Plugins (via TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alberti42/tmux-fzf-links'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# tmux-continuum must be last so status-right hook isn't clobbered
set -g @plugin 'tmux-plugins/tmux-continuum'

# fzf-links settings
set -g @fzf-links-use-colors on

# tmux-resurrect: also save/restore pane contents (terminal scrollback)
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum: restore last session automatically on tmux server start
set -g @continuum-restore 'on'

set -g @continuum-save-interval '15'

# Show how long ago continuum last saved. Must be set BEFORE the tpm run
# below so continuum can prepend its auto-save hook to status-right;
# setting it afterwards would clobber the hook and silently break auto-saving.
set -g status-right 'Saved: #(~/.config/tmux/continuum-last-saved.sh)'

# Bootstrap TPM (install with: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm)
run '~/.tmux/plugins/tpm/tpm'
