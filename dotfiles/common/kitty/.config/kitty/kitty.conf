# Font size
# TODO: this should be applied only on macOS
# font_size 16.0

# Remap Cmd+A to send Meta+A (ESC + a) so tmux sees it as the prefix (M-a)
map cmd+a send_text all \x1ba

# Send only Shift+Enter as CSI-u, which tmux can decode and forward to Pi.
# Enabling the full Kitty keyboard protocol in tmux breaks navigation keys.
map shift+enter send_text all \x1b[13;2u
